[project]
name = "auto_startup_ai"
version = "0.1.0"
description = "auto_startup_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1"
]

[project.scripts]
auto_startup_ai = "auto_startup_ai.main:run"
run_crew = "auto_startup_ai.main:run"
train = "auto_startup_ai.main:train"
replay = "auto_startup_ai.main:replay"
test = "auto_startup_ai.main:test"
run_with_trigger = "auto_startup_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
