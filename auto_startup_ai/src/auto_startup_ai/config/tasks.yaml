architecture_task:
  description: >
    Design technical system architecture for the startup
  expected_output: >
    Technical architecture document
  agent: tech_architect_agent
  context:
    - design_task
    - finance_task

code_task:
  description: >
    Generate the MVP code structure
  expected_output: >
    Repository structure and starter code
  agent: code_agent
  context:
    - architecture_task

website_task:
  description: >
    Generate landing page HTML and Tailwind CSS
  expected_output: >
    Landing page code
  agent: website_agent
  context:
    - marketing_task
  output_file: index.html

pitch_task:
  description: >
    Create a 10-slide investor pitch deck
  expected_output: >
    Pitch deck outline and content
  agent: pitch_agent
  context:
    - marketing_task
    - finance_task

final_task:
  description: >
    Compile all outputs into a complete startup blueprint
  expected_output: >
    Investor-ready startup report
  agent: report_agent
  output_file: research/startup_blueprint.md
  context:
    - trend_task
    - market_task
    - idea_task
    - critic_task
    - design_task
    - marketing_task
    - finance_task
    - architecture_task
    - code_task
    - website_task
    - pitch_task