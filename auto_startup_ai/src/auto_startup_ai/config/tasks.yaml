trend_task:
  description: >
    Identify top 5 emerging AI and sustainability trends
  expected_output: >
    List of trends with confidence scores
  agent: trend_agent

market_task:
  description: >
    Identify high-growth markets and competitor gaps
  expected_output: >
    Detailed market research report
  agent: market_agent
  context:
    - trend_task

idea_task:
  description: >
    Generate 3 innovative startup ideas based on market research
  expected_output: >
    Detailed startup ideas
  agent: idea_agent
  context:
    - market_task

critic_task:
  description: >
    Evaluate the generated startup ideas
  expected_output: >
    Evaluation report and selected winning idea
  agent: critic_agent
  context:
    - idea_task

design_task:
  description: >
    Design an MVP for the winning startup idea
  expected_output: >
    Product specification document
  agent: product_agent
  context:
    - critic_task

marketing_task:
  description: >
    Create a go-to-market strategy for the MVP
  expected_output: >
    12-month marketing plan
  agent: marketing_agent
  context:
    - design_task

finance_task:
  description: >
    Generate financial projections.
  expected_output: >
    Startup financial model.
  agent: finance_agent
  context:
    - marketing_task

